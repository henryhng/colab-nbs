[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showdiffraction-live"
version = "0.1.0"
description = "Browser-ready ShowDiffraction: interactive diffraction analysis without torch"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.11.0",
    "numpy>=1.26.0",
    "traitlets>=5.0.0",
]

[project.optional-dependencies]
# scipy is only needed by the analysis paths (refine, detect, fits) and is the
# largest WASM download, so the web app installs it in the background after
# the widget renders. Native installs should use the extra.
full = [
    "scipy>=1.10.0",
    "tifffile>=2024.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/showdiffraction_live"]
artifacts = ["src/showdiffraction_live/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/showdiffraction_live/static/**"]
